<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Lost & Found Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a th:href="@{/}" class="brand"><i class="fa-solid fa-box-open"></i> Lost & Found System</a>
            <ul class="nav-links">
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/search}">Search Items</a></li>
                <li><a th:href="@{/dashboard}">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="form-card" style="max-width: 500px;">
            <div class="form-header">
                <i class="fa-solid fa-user-gear" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem;"></i>
                <h2 style="font-size: 1.6rem; font-weight: 700;">Account Profile</h2>
                <p style="color: var(--slate); font-size: 0.9rem;">Manage your contact details</p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/profile/update}" method="post">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" th:value="${user.name}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address (Read-only)</label>
                    <input type="email" th:value="${user.email}" class="form-control" readonly style="background:#f1f5f9;">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" th:value="${user.phone}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Account Role</label>
                    <input type="text" th:value="${user.role}" class="form-control" readonly style="background:#f1f5f9;">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                    Update Profile Details
                </button>
            </form>
        </div>
    </main>

</body>
</html>
